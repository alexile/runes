[package]
name = "rune-rot13"
version = "0.2.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "ROT13 cipher — rotate ASCII letters by 13 positions"
license.workspace = true
keywords = ["rot13", "cipher", "encoding", "ctf", "cryptography"]
categories = ["encoding", "command-line-utilities"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
required-features = ["cli"]
name = "rune-rot13"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
# Without `std` the library builds on `core` and `alloc` only.
std = []
cli = ["dep:clap", "std"]

[dependencies]
clap = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
