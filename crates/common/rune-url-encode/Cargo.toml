[package]
name = "rune-url-encode"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "URL percent-encoding and decoding for byte slices and strings"
license.workspace = true
keywords = ["url", "percent-encoding", "uri", "encode", "decode"]
categories = ["encoding", "command-line-utilities"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-url-encode"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["std"]
# Without `std` the library builds on `core` and `alloc` only.
std = []
cli = ["std"]

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
