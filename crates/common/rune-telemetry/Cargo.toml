[package]
name = "rune-telemetry"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "One-call tracing subscriber and OTLP trace export bootstrap configured from OTEL_* and RUST_LOG environment variables"
license.workspace = true
keywords = ["tracing", "opentelemetry", "otlp", "telemetry", "logging"]
categories = ["development-tools::debugging", "development-tools::profiling"]
repository.workspace = true
readme = "README.md"
publish = false

[features]
## OTLP/gRPC trace export through `tracing-opentelemetry`. Off by default so
## libraries that only need the configuration types don't pull OpenTelemetry.
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:http",
    "dep:tokio",
]
## The `json` log format (`RUST_LOG_FORMAT=json`).
json = ["tracing-subscriber/json"]

[dependencies]
http = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true, features = ["trace"] }
opentelemetry-otlp = { workspace = true, optional = true, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { workspace = true, optional = true, features = ["trace"] }
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["rt"] }
tracing.workspace = true
tracing-opentelemetry = { version = "0.34.0", default-features = false, optional = true }
tracing-subscriber = { workspace = true, features = ["std", "fmt", "registry", "env-filter", "ansi"] }

[dev-dependencies]
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic", "trace"] }
opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }
proptest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tonic = { version = "0.14", default-features = false, features = ["server", "router", "codegen"] }

[[test]]
name = "otlp"
required-features = ["otlp"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
