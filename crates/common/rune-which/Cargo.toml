[package]
name = "rune-which"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Cross-platform executable lookup on PATH or in given directories, honouring PATHEXT"
license.workspace = true
keywords = ["which", "path", "pathext", "executable", "lookup"]
categories = ["filesystem", "os"]
repository.workspace = true
readme = "README.md"
publish = false

[[bin]]
name = "rune-which"
path = "src/main.rs"
required-features = ["cli"]

[features]
cli = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
