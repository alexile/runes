[package]
name = "rune-hex"
version = "0.2.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Hex encoding and decoding for byte slices and files — lowercase, uppercase, and streaming output"
license.workspace = true
keywords = ["hex", "encoding", "decoding", "cryptography", "cli"]
categories = ["encoding", "command-line-utilities"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
required-features = ["cli"]
name = "rune-hex"
path = "src/main.rs"

[features]
default = ["std"]
# Without `std` the library builds on `core` and `alloc` only.
std = []
cli = ["dep:clap", "std"]

[dependencies]
clap = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
