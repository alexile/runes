[package]
name = "rune-ascii"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "ASCII table lookup and character conversion — decimal, hex, octal, binary, and char"
license.workspace = true
keywords = ["ascii", "encoding", "table", "ctf", "converter"]
categories = ["encoding", "command-line-utilities"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
required-features = ["cli"]
name = "rune-ascii"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
# Without `std` the library builds on `core` and `alloc` only.
std = []
cli = ["dep:clap", "std"]

[dependencies]
clap = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
