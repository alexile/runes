[package]
name = "rune-byte-magic"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Identify file types from magic bytes — pure Rust, no libmagic dependency"
license.workspace = true
keywords = ["magic", "filetype", "binary", "forensics", "mime"]
categories = ["command-line-utilities", "encoding"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
required-features = ["cli"]
name = "rune-byte-magic"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
# Without `std` the library builds on `core` and `alloc` only.
std = []
cli = ["dep:clap", "std"]

[dependencies]
clap = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
