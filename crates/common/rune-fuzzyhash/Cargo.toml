[package]
name = "rune-fuzzyhash"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "TLSH and ssdeep (CTPH) fuzzy hashes with distance scoring for near-identical files and payloads"
license = "MIT AND BSD-3-Clause"
keywords = ["tlsh", "ssdeep", "fuzzy-hash", "similarity", "malware"]
categories = ["algorithms", "encoding"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-fuzzyhash"
path = "src/main.rs"
required-features = ["cli"]

[features]
cli = ["dep:clap"]
## Serialize digests as their string form.
serde = ["dep:serde"]

[dependencies]
clap = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
