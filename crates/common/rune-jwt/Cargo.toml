[package]
name = "rune-jwt"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Decode and inspect JWT claims without verification — tear open any token for debugging and CTF work"
license.workspace = true
keywords = ["jwt", "decode", "inspect", "token", "security"]
categories = ["authentication", "command-line-utilities"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-jwt"
path = "src/main.rs"
required-features = ["cli"]

[features]
cli = []

[dependencies]
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
rune-base64.workspace = true

[lints]
workspace = true
