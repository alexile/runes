[package]
name = "rune-secret-vault"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Secret providers (env, file, OS keyring, HashiCorp Vault) with TTL caching over rune-secret-ref"
license.workspace = true
keywords = ["secret", "vault", "keyring", "credentials", "provider"]
categories = ["config", "authentication"]
repository.workspace = true
readme = "README.md"
publish = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# `KeyringProvider`: `keychain:service/account` from an OS credential store
# (keyring-core; bring your own platform store crate).
keyring = ["dep:keyring-core"]
# `VaultProvider`: `vault:mount/path#field` from HashiCorp Vault KV v1/v2,
# sans-I/O over a pluggable `VaultTransport`.
vault = ["dep:serde_json"]
# `UreqTransport`: a blocking HTTPS transport for `VaultProvider` (rustls,
# webpki roots).
vault-ureq = ["vault", "dep:ureq"]

[dependencies]
keyring-core = { version = "1", optional = true }
rune-secret-ref.workspace = true
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
ureq = { version = "3.3", optional = true, default-features = false, features = ["rustls"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
