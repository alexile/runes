[package]
name = "rune-geohash"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Geohash encode/decode"
license.workspace = true
keywords = ["geohash", "geo", "encoding", "gps", "location"]
categories = ["algorithms", "encoding", "command-line-utilities"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-geohash"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "rune_geohash"
path = "src/lib.rs"

[features]
default = ["std"]
# Without `std` the library builds on `core` and `alloc` only.
std = []
cli = ["dep:clap", "std"]

[dependencies]
clap = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
