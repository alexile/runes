[package]
name = "rune-haversine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Great-circle distance and bearing between coordinates"
license.workspace = true
keywords = ["haversine", "distance", "bearing", "geo", "gps"]
categories = ["algorithms", "science", "command-line-utilities"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-haversine"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "rune_haversine"
path = "src/lib.rs"

[features]
cli = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
