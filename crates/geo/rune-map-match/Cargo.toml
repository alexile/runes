[package]
name = "rune-map-match"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Snap a noisy position stream onto the nearest edges of a supplied road/path graph"
license.workspace = true
keywords = ["map-matching", "geospatial", "gps", "snapping", "routing"]
categories = ["algorithms", "science", "command-line-utilities"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-map-match"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "rune_map_match"
path = "src/lib.rs"

[features]
cli = ["dep:clap", "dep:serde", "dep:serde_json"]

[dependencies]
clap = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[lints]
workspace = true
