[package]
name = "rune-kalman-track"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Kalman filter for smoothing noisy position/velocity readings"
license.workspace = true
keywords = ["kalman", "tracking", "geospatial", "filter", "gps"]
categories = ["algorithms", "science", "command-line-utilities"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-kalman-track"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "rune_kalman_track"
path = "src/lib.rs"

[features]
cli = ["dep:clap", "dep:serde_json"]

[dependencies]
clap = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[lints]
workspace = true
