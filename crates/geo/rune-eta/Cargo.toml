[package]
name = "rune-eta"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Distance- and speed-profile-based arrival time estimator"
license.workspace = true
keywords = ["eta", "arrival", "logistics", "fleet", "routing"]
categories = ["algorithms", "science", "command-line-utilities"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-eta"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "rune_eta"
path = "src/lib.rs"

[features]
cli = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }

[lints]
workspace = true
