[package]
name = "rune-trace-replay"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Replay a recorded position trace at a configurable speed multiplier through any sink"
license.workspace = true
keywords = ["gps", "replay", "trace", "simulation", "geospatial"]
categories = ["data-structures", "simulation", "command-line-utilities"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-trace-replay"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "rune_trace_replay"
path = "src/lib.rs"

[features]
cli = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }

[lints]
workspace = true
