[package]
name = "rune-static-map"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Build static-map image request parameters/URLs from a set of features"
license.workspace = true
keywords = ["static-map", "map", "url", "geo", "gis"]
categories = ["algorithms", "science", "command-line-utilities"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-static-map"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "rune_static_map"
path = "src/lib.rs"

[features]
cli = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }

[lints]
workspace = true
