[package]
name = "rune-chain-macros"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Proc macros for rune-chain: #[tool] turns a function into an LLM tool with a generated JSON Schema, #[derive(Embed)] marks the text fields to embed"
license.workspace = true
keywords = ["llm", "tool", "macro", "embeddings", "agent"]
categories = ["development-tools::procedural-macro-helpers", "asynchronous"]
repository.workspace = true
readme = "README.md"
publish = true

[lib]
proc-macro = true

[dependencies]
proc-macro-crate.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["clone-impls", "derive", "full", "parsing", "printing", "proc-macro", "visit"] }

# Path-only on purpose: these depend on this crate, so they are dropped on
# publish and the expansion is tested from the outside.
[dev-dependencies]
rune-chain-core = { path = "../rune-chain-core", features = ["macros"] }
rune-chain-embed = { path = "../rune-chain-embed", features = ["derive", "vectorstore"] }
rune-vectorstore = { path = "../rune-vectorstore" }
async-trait.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
trybuild.workspace = true

[lints]
workspace = true
