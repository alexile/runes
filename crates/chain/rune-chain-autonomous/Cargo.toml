[package]
name = "rune-chain-autonomous"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Budgeted autonomous agent for rune-chain: plans and runs tasks toward a goal under hard limits, with loop detection, approval-gated tools, checkpoints and events"
license.workspace = true
keywords = ["agent", "autonomous", "llm", "planning", "ai"]
categories = ["asynchronous"]
repository.workspace = true
readme = "README.md"
publish = true

[dependencies]
rune-chain-core.workspace = true
rune-chain-agent.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "sync"] }

[dev-dependencies]
rune-chain-core = { workspace = true, features = ["testing"] }
tokio-test.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
proptest.workspace = true

[lints]
workspace = true
