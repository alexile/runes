[package]
name = "rune-chain-retry"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Resilience and routing for rune-chain Llm: retries with jittered backoff, multi-provider router with circuit breakers"
license.workspace = true
keywords = ["llm", "retry", "router", "circuit-breaker", "fallback"]
categories = ["asynchronous"]
repository.workspace = true
readme = "README.md"
publish = true

[dependencies]
rune-chain-core.workspace = true
async-trait.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["time", "rt", "macros", "rt-multi-thread"] }

[dev-dependencies]
rune-chain-core = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
