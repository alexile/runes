[package]
name = "rune-chain-retrieval"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "RAG for rune-chain: RetrievalQaChain, BM25, hybrid fusion (RRF), MMR, multi-query and Cohere/Jina/Voyage reranking"
license.workspace = true
keywords = ["rag", "retrieval", "llm", "langchain", "ai"]
categories = ["asynchronous", "science"]
repository.workspace = true
readme = "README.md"
publish = true

[dependencies]
rune-chain-core.workspace = true
rune-chain-embed.workspace = true
rune-vectorstore.workspace = true
async-trait.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
rune-chain-core = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["full"] }
proptest.workspace = true
tokio-test.workspace = true

[lints]
workspace = true
