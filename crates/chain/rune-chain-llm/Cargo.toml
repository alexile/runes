[package]
name = "rune-chain-llm"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "LlmChain — wire a prompt template, an LLM, and optional memory into a single Chain"
license.workspace = true
keywords = ["llm", "langchain", "chain", "prompt", "ai"]
categories = ["asynchronous"]
repository.workspace = true
readme = "README.md"
publish = true

[dependencies]
rune-chain-core.workspace = true
rune-chain-prompt.workspace = true
rune-tokenize.workspace = true
async-trait.workspace = true
futures.workspace = true

[dev-dependencies]
rune-chain-core = { workspace = true, features = ["testing"] }
rune-chain-memory.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-test.workspace = true

[lints]
workspace = true
