[package]
name = "rune-chain-llm"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "LlmChain for rune-chain: prompt template + LLM + memory, with structured output, output parsers, streaming into memory, usage and finish reason"
license.workspace = true
keywords = ["llm", "langchain", "chain", "prompt", "ai"]
categories = ["asynchronous"]
repository.workspace = true
readme = "README.md"
publish = true

[dependencies]
rune-chain-core.workspace = true
rune-chain-output-parser.workspace = true
rune-chain-prompt.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
rune-chain-core = { workspace = true, features = ["testing"] }
rune-chain-memory.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-test.workspace = true

[lints]
workspace = true
