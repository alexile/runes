[package]
name = "rune-chain-openai"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "OpenAI and OpenAI-compatible (Azure, Mistral, Groq, Together, DeepSeek, OpenRouter, vLLM, LM Studio) LLM provider for rune-chain: streaming, tools, structured output"
license.workspace = true
keywords = ["openai", "gpt", "llm", "langchain", "ai"]
categories = ["asynchronous", "web-programming::http-client"]
repository.workspace = true
readme = "README.md"
publish = true

[dependencies]
rune-chain-core.workspace = true
async-trait.workspace = true
async-stream.workspace = true
futures.workspace = true
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
rune-sse = { workspace = true, features = ["stream"] }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
rune-chain-core = { workspace = true, features = ["testing"] }
tokio-test.workspace = true

[lints]
workspace = true
