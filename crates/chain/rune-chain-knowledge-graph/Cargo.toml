[package]
name = "rune-chain-knowledge-graph"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "GraphRAG for the rune-chain LLM framework: schema-validated entity and relation extraction, entity resolution, provenance, and bounded k-hop retrieval with cited context"
license.workspace = true
keywords = ["knowledge-graph", "graphrag", "llm", "rag", "extraction"]
categories = ["text-processing", "science"]
repository.workspace = true
readme = "README.md"
publish = true

[dependencies]
rune-chain-core.workspace = true
rune-graph.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
rune-chain-embed = { workspace = true, optional = true }

[features]
# Adapter for any `rune_chain_embed::Embedder` (`FromEmbedder`).
embed = ["dep:rune-chain-embed"]

[dev-dependencies]
rune-chain-core = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["full"] }
tokio-test.workspace = true
proptest.workspace = true

[lints]
workspace = true
