[package]
name = "rune-chain-knowledge-graph"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "LLM-powered knowledge graph: extract entity-relation-entity triples from text and store them in a queryable rune-graph property graph"
license.workspace = true
keywords = ["knowledge-graph", "llm", "nlp", "graph", "extraction"]
categories = ["text-processing", "science"]
repository.workspace = true
readme = "README.md"
publish = true

[dependencies]
rune-chain-core.workspace = true
rune-graph.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
rune-chain-core = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["full"] }
tokio-test.workspace = true
rune-chain-splitter.workspace = true

[lints]
workspace = true
