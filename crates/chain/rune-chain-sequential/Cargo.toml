[package]
name = "rune-chain-sequential"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "SequentialChain for rune-chain: ordered pipelines with build-time key checks, input/output mapping, per-step timeouts and retries, early exit, step events and summed usage"
license.workspace = true
keywords = ["llm", "langchain", "chain", "sequential", "ai"]
categories = ["asynchronous"]
repository.workspace = true
readme = "README.md"
publish = true

[dependencies]
rune-chain-core.workspace = true
async-trait.workspace = true
futures.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
rune-chain-core = { workspace = true, features = ["testing"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-test.workspace = true

[lints]
workspace = true
