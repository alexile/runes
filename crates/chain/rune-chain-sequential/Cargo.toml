[package]
name = "rune-chain-sequential"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "SequentialChain — run rune-chain chains in order, piping each output as input to the next"
license.workspace = true
keywords = ["llm", "langchain", "chain", "sequential", "ai"]
categories = ["asynchronous"]
repository.workspace = true
readme = "README.md"
publish = true

[dependencies]
rune-chain-core.workspace = true
async-trait.workspace = true
serde_json.workspace = true

[dev-dependencies]
rune-chain-core = { workspace = true, features = ["testing"] }
rune-chain-memory.workspace = true
rune-chain-prompt.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-test.workspace = true

[lints]
workspace = true
