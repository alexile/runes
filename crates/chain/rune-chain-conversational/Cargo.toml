[package]
name = "rune-chain-conversational"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "ConversationalChain for rune-chain: multi-turn dialogue with a pinned system prompt, bounded token-budget or summary memory, and streams recorded in memory"
license.workspace = true
keywords = ["llm", "langchain", "chatbot", "conversation", "ai"]
categories = ["asynchronous"]
repository.workspace = true
readme = "README.md"
publish = true

[dependencies]
rune-chain-core.workspace = true
rune-chain-llm.workspace = true
rune-chain-memory.workspace = true
async-trait.workspace = true
futures.workspace = true

[dev-dependencies]
rune-chain-core = { workspace = true, features = ["testing"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-test.workspace = true

[lints]
workspace = true
