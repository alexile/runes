[package]
name = "rune-chain"
version = "0.1.7"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "One-dependency LLM toolkit: OpenAI, Anthropic, Gemini, Ollama, Groq, Mistral, xAI, DeepSeek, OpenRouter, Azure and more clients, agents with tools, RAG and memory, typed extraction, streaming. Re-exports the rune-chain stack behind features"
license.workspace = true
keywords = ["llm", "agent", "rag", "openai", "anthropic"]
categories = ["asynchronous", "science", "web-programming::http-client"]
repository.workspace = true
readme = "README.md"
publish = true

[features]
default = ["openai", "macros"]
## OpenAI and OpenAI-compatible providers (also turns on `embed` for OpenAI embeddings).
openai = ["dep:rune-chain-openai", "embed"]
## Anthropic Claude.
anthropic = ["dep:rune-chain-anthropic"]
## Google Gemini (Gemini API and Vertex AI), chat and embeddings.
gemini = ["dep:rune-chain-gemini", "rune-chain-gemini/embed", "embed"]
## Ollama local models, chat and embeddings.
ollama = ["dep:rune-chain-ollama", "embed"]
## Azure OpenAI (`rune_chain::azure`), chat by deployment name.
azure = ["openai"]
## Groq (`rune_chain::groq`).
groq = ["openai"]
## Mistral (`rune_chain::mistral`), chat and embeddings.
mistral = ["openai"]
## DeepSeek (`rune_chain::deepseek`).
deepseek = ["openai"]
## xAI Grok (`rune_chain::xai`).
xai = ["openai"]
## OpenRouter (`rune_chain::openrouter`).
openrouter = ["openai"]
## Together AI (`rune_chain::together`).
together = ["openai"]
## Fireworks AI (`rune_chain::fireworks`), chat and embeddings.
fireworks = ["openai"]
## Cerebras (`rune_chain::cerebras`).
cerebras = ["openai"]
## Moonshot AI Kimi (`rune_chain::moonshot`).
moonshot = ["openai"]
## Hyperbolic (`rune_chain::hyperbolic`).
hyperbolic = ["openai"]
## Hugging Face Inference Providers router (`rune_chain::huggingface`).
huggingface = ["openai"]
## NVIDIA NIM (`rune_chain::nvidia`).
nvidia = ["openai"]
## SambaNova Cloud (`rune_chain::sambanova`).
sambanova = ["openai"]
## Cohere's OpenAI compatibility API (`rune_chain::cohere`), chat and embeddings.
cohere = ["openai"]
## Self-hosted vLLM (`rune_chain::vllm`), chat and embeddings.
vllm = ["openai"]
## LM Studio local server (`rune_chain::lmstudio`), chat and embeddings.
lmstudio = ["openai"]
## Every provider client above plus OpenAI, Anthropic, Gemini and Ollama.
all-providers = ["openai", "anthropic", "gemini", "ollama", "azure", "groq", "mistral", "deepseek", "xai", "openrouter", "together", "fireworks", "cerebras", "moonshot", "hyperbolic", "huggingface", "nvidia", "sambanova", "cohere", "vllm", "lmstudio"]
## `Embedder`, `EmbeddingsClient` and the OpenAI/Cohere/Voyage/Jina embedders.
embed = ["dep:rune-chain-embed"]
## `#[tool]` (as `rune_chain::tool`) and, with `embed`, `#[derive(Embed)]`.
macros = ["rune-chain-core/macros", "rune-chain-embed?/derive"]
## Vector stores: the `VectorStore` trait, exact and HNSW in-memory indexes.
vectorstore = ["dep:rune-vectorstore"]
## Qdrant vector store (`QdrantStore`) over the REST API.
qdrant = ["dep:rune-vectorstore-qdrant", "vectorstore"]
## Postgres + pgvector vector store (`PgVectorStore`): HNSW or IVFFlat, jsonb filters.
pgvector = ["dep:rune-vectorstore-pgvector", "vectorstore"]
## Embedded single-file SQLite vector store (`SqliteVectorStore`), exact search.
sqlite = ["dep:rune-vectorstore-sqlite", "vectorstore", "rune-chain-graph?/sqlite"]
## RAG: `AgentBuilder::dynamic_context`, `EmbeddingIndex`, retrievers and rerankers.
retrieval = ["dep:rune-chain-retrieval", "embed", "vectorstore", "rune-chain-eval?/retrieval"]
## Evaluation: datasets, heuristic, LLM-as-judge, RAG and trajectory metrics, run comparison.
eval = ["dep:rune-chain-eval", "embed"]
## Stateful graphs (`StateGraph`), checkpoints, interrupts and `create_react_agent`;
## with `sqlite`, also the SQLite checkpointer.
graph = ["dep:rune-chain-graph"]
## MCP client and server (`rune-mcp` with its `chain` bridge).
mcp = ["dep:rune-mcp"]
## OpenTelemetry GenAI spans for model and tool calls.
otel = ["dep:rune-otel-genai"]
## `.with_timeout(..)` and `.with_retry(..)` on any `Llm` or `Chain`.
tokio = ["rune-chain-core/tokio"]
## `testing::FakeLlm`, a scriptable offline model, plus trait-contract checks.
testing = ["rune-chain-core/testing"]
## Everything above.
full = ["all-providers", "embed", "macros", "vectorstore", "qdrant", "pgvector", "sqlite", "retrieval", "eval", "graph", "mcp", "otel", "tokio"]

[dependencies]
rune-chain-core.workspace = true
rune-chain-agent.workspace = true
rune-chain-memory.workspace = true
rune-chain-output-parser = { workspace = true, features = ["schemars"] }
rune-chain-prompt.workspace = true
rune-tool-schema = { workspace = true, features = ["schemars"] }
rune-chain-openai = { workspace = true, optional = true }
rune-chain-anthropic = { workspace = true, optional = true }
rune-chain-gemini = { workspace = true, optional = true }
rune-chain-ollama = { workspace = true, optional = true }
rune-chain-embed = { workspace = true, optional = true }
rune-vectorstore = { workspace = true, optional = true }
rune-vectorstore-qdrant = { workspace = true, optional = true }
rune-vectorstore-pgvector = { workspace = true, optional = true }
rune-vectorstore-sqlite = { workspace = true, optional = true }
rune-chain-retrieval = { workspace = true, optional = true }
rune-chain-eval = { workspace = true, optional = true }
rune-chain-graph = { workspace = true, optional = true }
rune-mcp = { workspace = true, optional = true, features = ["chain"] }
rune-otel-genai = { workspace = true, optional = true }
async-stream.workspace = true
async-trait.workspace = true
futures.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
rune-chain-core = { workspace = true, features = ["testing"] }
reqwest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[[test]]
name = "providers"
required-features = ["all-providers"]

[[example]]
name = "agent_with_tools"
required-features = ["openai"]

[[example]]
name = "tool_macro"
required-features = ["openai", "macros"]

[[example]]
name = "extractor"
required-features = ["openai"]

[[example]]
name = "rag"
required-features = ["openai", "retrieval"]

[[example]]
name = "multimodal"
required-features = ["openai"]

[[example]]
name = "streaming"
required-features = ["anthropic"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
