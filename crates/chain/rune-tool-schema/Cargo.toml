[package]
name = "rune-tool-schema"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Tool definitions for LLM function calling: MCP descriptor, OpenAI/Anthropic/Gemini export with schema lint, argument validation and text hygiene"
license.workspace = true
keywords = ["mcp", "llm", "tools", "agent", "json-schema"]
categories = ["data-structures", "encoding"]
repository.workspace = true
readme = "README.md"
publish = true

[features]
## Generate input/output schemas from Rust types and derive
## `schemars::JsonSchema` for the descriptor types.
schemars = ["dep:schemars"]

[dependencies]
regex.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
