[package]
name = "rune-vectorstore-sqlite"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Embedded single-file SQLite vector store for rune-vectorstore: exact search with a bounded top-k scan, WAL, bound JSON metadata filters"
license.workspace = true
keywords = ["vector", "sqlite", "embeddings", "rag", "similarity"]
categories = ["database", "data-structures", "science"]
repository.workspace = true
readme = "README.md"
publish = true

[features]
default = ["tokio"]
## Run blocking database calls on tokio's blocking pool when inside a tokio runtime.
tokio = ["dep:tokio"]

[dependencies]
rune-vectorstore.workspace = true
async-trait.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"], optional = true }

[dev-dependencies]
rusqlite = "0.40"
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-test.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
