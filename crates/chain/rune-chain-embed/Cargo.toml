[package]
name = "rune-chain-embed"
version = "0.3.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Embedder trait, hardened OpenAI-compatible/Cohere/Voyage/Jina embedding providers, batching and caching for the rune-chain LLM framework"
license.workspace = true
keywords = ["embeddings", "openai", "llm", "langchain", "cache"]
categories = ["asynchronous", "web-programming::http-client"]
repository.workspace = true
readme = "README.md"
publish = true

[dependencies]
rune-chain-core.workspace = true
rune-base64.workspace = true
rune-chain-macros = { workspace = true, optional = true }
rune-vectorstore = { workspace = true, optional = true }
async-trait.workspace = true
futures.workspace = true
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }

[features]
# `#[derive(Embed)]`.
derive = ["dep:rune-chain-macros"]
# `to_records` and `VectorStoreExt::add_documents`: embed `Embed` documents
# straight into a `rune-vectorstore` store.
vectorstore = ["dep:rune-vectorstore"]

[dev-dependencies]
rune-chain-core = { workspace = true, features = ["testing"] }
rune-base64.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-test.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
