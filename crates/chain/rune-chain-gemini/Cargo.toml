[package]
name = "rune-chain-gemini"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Google Gemini LLM provider for rune-chain: Gemini API and Vertex AI, streaming, tools, structured output, thinking, safety settings and embeddings"
license.workspace = true
keywords = ["gemini", "google", "llm", "langchain", "ai"]
categories = ["asynchronous", "web-programming::http-client"]
repository.workspace = true
readme = "README.md"
publish = true

[features]
## `GeminiEmbedder`, implementing rune-chain-embed's `Embedder`.
embed = ["dep:rune-chain-embed"]

[dependencies]
rune-chain-core.workspace = true
rune-base64.workspace = true
rune-chain-embed = { workspace = true, optional = true }
rune-tool-schema.workspace = true
async-trait.workspace = true
async-stream.workspace = true
futures.workspace = true
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
rune-sse = { workspace = true, features = ["stream"] }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
rune-chain-core = { workspace = true, features = ["testing"] }
tokio-test.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
