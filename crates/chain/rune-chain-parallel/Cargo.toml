[package]
name = "rune-chain-parallel"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "ParallelChain for rune-chain: fan-out to multiple chains concurrently and merge outputs"
license.workspace = true
keywords = ["llm", "langchain", "parallel", "chain", "ai"]
categories = ["asynchronous", "concurrency"]
repository.workspace = true
readme = "README.md"
publish = true

[dependencies]
rune-chain-core.workspace = true
async-trait.workspace = true
futures.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

[dev-dependencies]
rune-chain-core = { workspace = true, features = ["testing"] }

[lints]
workspace = true
