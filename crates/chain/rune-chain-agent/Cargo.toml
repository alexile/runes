[package]
name = "rune-chain-agent"
version = "0.3.4"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Hardened tool-calling agents for rune-chain: ReAct and native function calling with schema validation, limits, approval and fenced tool output"
license.workspace = true
keywords = ["agent", "llm", "react", "langchain", "ai"]
categories = ["asynchronous"]
repository.workspace = true
readme = "README.md"
publish = true

[dependencies]
rune-chain-core.workspace = true
async-trait.workspace = true
futures.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
rune-chain-core = { workspace = true, features = ["testing"] }
tokio-test.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
