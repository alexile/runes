[package]
name = "rune-graph"
version = "0.4.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Embedded directed property graph: labels, key-value properties, property indexes, lazy traversal, algorithms, and safe snapshot persistence with an optional WAL"
license.workspace = true
keywords = ["graph", "database", "property-graph", "embedded", "knowledge-graph"]
categories = ["data-structures", "database-implementations"]
repository.workspace = true
readme = "README.md"
publish = true

[features]
default = []
persist = ["dep:serde", "dep:serde_json", "dep:bincode"]
wal     = ["persist"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
bincode    = { version = "1", optional = true }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
