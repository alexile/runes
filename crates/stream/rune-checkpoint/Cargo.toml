[package]
name = "rune-checkpoint"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Resumable-cursor/offset persistence for restartable stream consumers"
license.workspace = true
keywords = ["checkpoint", "cursor", "offset", "streaming", "resume"]
categories = ["data-structures", "filesystem", "command-line-utilities"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-checkpoint"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "rune_checkpoint"
path = "src/lib.rs"

[features]
cli = ["dep:clap"]

[dependencies]
serde_json.workspace = true
clap = { workspace = true, optional = true }

[lints]
workspace = true
