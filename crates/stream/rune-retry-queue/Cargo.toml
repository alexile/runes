[package]
name = "rune-retry-queue"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Dead-letter queue with configurable backoff retry for failed sink writes"
license.workspace = true
keywords = ["retry", "backoff", "dead-letter", "queue", "streaming"]
categories = ["data-structures", "algorithms"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-retry-queue"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "rune_retry_queue"
path = "src/lib.rs"

[features]
cli = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }

[lints]
workspace = true
