[package]
name = "rune-window-agg"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Tumbling/sliding/session window aggregator over a timestamped stream"
license.workspace = true
keywords = ["window", "aggregation", "streaming", "timeseries", "tumbling"]
categories = ["data-structures", "algorithms"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-window-agg"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "rune_window_agg"
path = "src/lib.rs"

[features]
cli = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
