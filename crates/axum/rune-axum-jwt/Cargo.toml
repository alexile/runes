[package]
name = "rune-axum-jwt"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "JWT bearer auth for Axum 0.8: HMAC, RSA, ECDSA and EdDSA keys, cached JWKS and OIDC discovery, scope/role checks, RFC 6750 errors"
license.workspace = true
keywords = ["axum", "jwt", "jwks", "oidc", "authentication"]
categories = ["web-programming::http-server", "authentication"]
repository.workspace = true
readme = "README.md"
publish = true

[features]
default = ["jwks", "rust_crypto"]
## `JwksSource`: fetch and cache keys from a JWKS URL or via OIDC discovery
## (reqwest + Tokio).
jwks = ["dep:reqwest", "dep:tokio"]
## Pure-Rust signature backend (RustCrypto: `rsa`, `p256`, `p384`,
## `ed25519-dalek`, `hmac`). Covers every algorithm this crate accepts. Only
## public-key verification is done with it, so the `rsa` crate's timing issue
## with private-key operations does not apply.
rust_crypto = ["jsonwebtoken/rust_crypto"]
## aws-lc-rs signature backend instead (needs a C toolchain). Turn off default
## features and enable this one to use it.
aws_lc_rs = ["jsonwebtoken/aws_lc_rs"]

[dependencies]
axum.workspace = true
http.workspace = true
# The signature backend is picked with this crate's `rust_crypto` (default) or
# `aws_lc_rs` feature. `use_pem` is needed for the PEM key constructors.
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["use_pem"] }
reqwest = { workspace = true, optional = true }
rune-jwt.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["sync"] }
tower-layer.workspace = true
tower-service.workspace = true
tracing.workspace = true

[dev-dependencies]
axum.workspace = true
ring = "0.17.14"
rune-base64.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true, features = ["util"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
