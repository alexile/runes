[package]
name = "rune-axum-cache"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Cache-Control and conditional-request middleware for Axum — sets caching directives and validators, answers 304/412 per RFC 9110"
license.workspace = true
keywords = ["axum", "middleware", "cache-control", "etag", "http"]
categories = ["web-programming::http-server", "web-programming", "caching"]
repository.workspace = true
readme = "README.md"
publish = false

[dependencies]
http.workspace = true
sha2.workspace = true
thiserror.workspace = true
tower.workspace = true

[dev-dependencies]
axum.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
