[package]
name = "rune-axum-signature"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Webhook signature verification layer and extractor for Axum: Standard Webhooks/Svix, Stripe, GitHub, Slack, Shopify and generic HMAC"
license.workspace = true
keywords = ["axum", "hmac", "webhook", "signature", "security"]
categories = ["web-programming::http-server", "cryptography"]
repository.workspace = true
readme = "README.md"
publish = true

[dependencies]
axum.workspace = true
tower-layer.workspace = true
tower-service.workspace = true
http.workspace = true
http-body-util.workspace = true
hmac.workspace = true
sha2.workspace = true
sha1.workspace = true
subtle.workspace = true
rune-base64.workspace = true

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true, features = ["util"] }
futures.workspace = true

[lints]
workspace = true
