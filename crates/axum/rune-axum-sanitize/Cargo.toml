[package]
name = "rune-axum-sanitize"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Defence-in-depth input sanitization for Axum: tokenizer-based tag stripping, HTML escaping or allowlist cleaning of query, form and JSON string values"
license.workspace = true
keywords = ["axum", "sanitize", "xss", "security", "middleware"]
categories = ["web-programming::http-server", "web-programming"]
repository.workspace = true
readme = "README.md"
publish = true

[features]
default = []
# Allowlist mode backed by ammonia (html5ever parser). Off by default because
# it pulls in the html5ever tree.
allowlist = ["dep:ammonia"]

[dependencies]
# MIT OR Apache-2.0. The de facto HTML allowlist sanitizer; hand-rolling one
# is how sanitizers get bypassed.
ammonia = { version = "4", optional = true }
axum.workspace = true
# Already in every axum build through url/serde_urlencoded. Using it means the
# middleware decodes query and form values exactly as axum's extractors do.
form_urlencoded = "1.2"
http.workspace = true
http-body-util.workspace = true
# Unicode-3.0. Already in the dependency graph through url -> idna.
icu_normalizer = "2"
rune-html-encode.workspace = true
serde_json.workspace = true
tower-layer.workspace = true
tower-service.workspace = true

[dev-dependencies]
axum.workspace = true
proptest.workspace = true
rune-html-encode.workspace = true
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
