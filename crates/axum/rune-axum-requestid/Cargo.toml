[package]
name = "rune-axum-requestid"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Request-id and W3C traceparent propagation layer for Axum — extensions, response header and tracing span"
license.workspace = true
keywords = ["axum", "request-id", "traceparent", "correlation", "middleware"]
categories = ["web-programming", "network-programming"]
repository.workspace = true
readme = "README.md"
publish = true

[features]
default = ["tracing"]
## Wrap every request in a `tracing` span carrying the request id and trace ids.
tracing = ["dep:tracing"]

[dependencies]
axum.workspace = true
http.workspace = true
rand.workspace = true
thiserror.workspace = true
tower-layer.workspace = true
tower-service.workspace = true
tracing = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
