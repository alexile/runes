rune-cors.workspace = true
rune-finding.workspace = true
thiserror.workspace = true
tower.workspace = true

[dev-dependencies]
axum.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
