[package]
name = "rune-proxy-protocol"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "HAProxy PROXY protocol v1 (text) and v2 (binary, TLVs) sans-I/O decoder and encoder, with an optional tokio adapter"
license.workspace = true
keywords = ["proxy-protocol", "haproxy", "load-balancer", "client-ip", "tlv"]
categories = ["network-programming", "parser-implementations", "encoding"]
repository.workspace = true
readme = "README.md"
publish = false

[features]
## Read and write headers on tokio `AsyncRead`/`AsyncWrite` streams.
tokio = ["dep:tokio", "tokio/io-util"]

[dependencies]
thiserror.workspace = true
tokio = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["full"] }

[[test]]
name = "tokio"
required-features = ["tokio"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
