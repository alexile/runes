# Upstream sources of rune-idna's embedded Unicode data (src/data.rs).
#
# All three files are pinned to a Unicode version and by SHA-256. To update:
# download the files of the new version into one directory, check their
# checksums, then run
#
#     RUNE_IDNA_UCD_DIR=<dir> cargo test -p rune-idna --test regenerate -- --ignored
#
# review the diff of src/data.rs and pin the new version and checksums here.
