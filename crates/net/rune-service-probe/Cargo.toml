[package]
name = "rune-service-probe"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Read-only service probing framework: a sans-I/O ServiceProbe trait, ServiceInfo model and a bounded tokio runner"
license.workspace = true
keywords = ["network", "scanner", "banner", "probe", "security"]
categories = ["network-programming", "asynchronous"]
repository.workspace = true
readme = "README.md"
publish = true

[features]
## Async runner over tokio TCP/UDP sockets, with timeouts and a concurrency bound.
tokio = ["dep:tokio", "dep:futures", "tokio/net", "tokio/time", "tokio/io-util", "tokio/sync"]
## Serialize and deserialize the model types (and the findings in them) with serde.
serde = ["dep:serde", "rune-finding/serde"]

[dependencies]
futures = { workspace = true, optional = true }
rune-finding.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }

[[test]]
name = "runner"
required-features = ["tokio"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
