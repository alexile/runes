[package]
name = "rune-cloud-ranges"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Cloud and CDN IP-range datasets (AWS, Google, Azure, Cloudflare, Fastly, Oracle, DigitalOcean) with provider, service and CDN lookup"
license.workspace = true
keywords = ["cloud", "cdn", "ip-ranges", "aws", "recon"]
categories = ["network-programming", "parsing"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-cloud-ranges"
path = "src/main.rs"
required-features = ["cli"]

[features]
cli = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }
rune-cidr.workspace = true
rune-ip.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
