[package]
name = "rune-http-auth"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Client-side HTTP authentication: Basic, Bearer, Digest (RFC 7616) and NTLM/Negotiate message framing over rune-http-model"
license.workspace = true
keywords = ["http", "authentication", "digest", "ntlm", "basic-auth"]
categories = ["authentication", "web-programming", "network-programming"]
repository.workspace = true
readme = "README.md"
publish = true
# The known-answer and property tests are test-only.
exclude = ["tests/"]

[dependencies]
rune-base64.workspace = true
rune-http-model.workspace = true
rune-md5.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
