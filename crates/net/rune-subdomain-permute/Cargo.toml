[package]
name = "rune-subdomain-permute"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Pattern-based subdomain permutation (alterx class): deterministic, deduplicated, bounded candidate generation"
license.workspace = true
keywords = ["subdomain", "permutation", "dns", "recon", "alterx"]
categories = ["network-programming", "command-line-utilities"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-subdomain-permute"
path = "src/main.rs"
required-features = ["cli"]

[features]
cli = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }
rune-dns-wire.workspace = true
rune-idna.workspace = true
rune-psl = { workspace = true, features = ["embedded"] }
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
rune-wildcard-dns.workspace = true

[lints]
workspace = true
