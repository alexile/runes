openapi: 3.0.3
info:
  title: Petstore (fixture)
  version: 1.0.0
servers:
  - url: https://petstore.example.test/v1
security:
  - bearerAuth: []
paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets
      tags: [pets]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
        - name: status
          in: query
          schema:
            type: string
            enum: [available, pending, sold]
      responses:
        '200':
          description: A paged array of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      operationId: createPet
      summary: Create a pet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          description: Created
  /pets/{petId}:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      operationId: showPetById
      tags: [pets]
      security:
        - api_key: []
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    put:
      operationId: updatePet
      tags: [pets]
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: rex
                age:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Updated
    delete:
      operationId: deletePet
      tags: [pets]
      security: []
      parameters:
        - name: X-Request-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
  /pets/{petId}/photo:
    post:
      operationId: uploadPhoto
      tags: [photos]
      parameters:
        - $ref: '#/components/parameters/PetId'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                caption:
                  type: string
                  maxLength: 3
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Uploaded
  /pets/{petId}/history:
    get:
      operationId: petHistory
      tags: [pets]
      parameters:
        - $ref: '#/components/parameters/PetId'
        - $ref: 'common.yaml#/components/parameters/Since'
      responses:
        '200':
          description: History
components:
  parameters:
    PetId:
      name: petId
      in: path
      required: true
      description: The id of the pet
      schema:
        type: string
      example: fido-7
  schemas:
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: doggie
        tag:
          type: string
        status:
          type: string
          enum: [available, pending, sold]
        birthDate:
          type: string
          format: date-time
        owner:
          $ref: '#/components/schemas/Owner'
    Pet:
      allOf:
        - $ref: '#/components/schemas/NewPet'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
              readOnly: true
    Owner:
      type: object
      properties:
        email:
          type: string
          format: email
        pets:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    api_key:
      type: apiKey
      in: header
      name: X-API-Key
