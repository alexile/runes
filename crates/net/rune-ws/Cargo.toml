[package]
name = "rune-ws"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Sans-I/O WebSocket (RFC 6455) framing, handshake and connection state machine, with optional permessage-deflate and tokio adapter"
license.workspace = true
keywords = ["websocket", "rfc6455", "framing", "sans-io", "proxy"]
categories = ["network-programming", "parser-implementations", "web-programming::websocket"]
repository.workspace = true
readme = "README.md"
publish = true

[features]
## permessage-deflate (RFC 7692) negotiation and compression, via flate2's pure-Rust backend.
deflate = ["dep:flate2"]
## Async client/server adapter over any tokio `AsyncRead + AsyncWrite` stream.
tokio = ["dep:tokio", "dep:rand", "tokio/io-util"]

[dependencies]
flate2 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
rune-base64.workspace = true
rune-sha1.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["full"] }

[[test]]
name = "tokio_adapter"
required-features = ["tokio"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
