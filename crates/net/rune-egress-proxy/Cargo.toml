[package]
name = "rune-egress-proxy"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Allowlisted, default-deny HTTP CONNECT egress proxy: host/CIDR allowlists, SSRF guard against non-global addresses, and DNS pinning"
license.workspace = true
keywords = ["proxy", "egress", "ssrf", "allowlist", "sandbox"]
categories = ["network-programming", "web-programming::http-server"]
repository.workspace = true
readme = "README.md"
# Depends on `rune-ip`, which is not on crates.io yet.
publish = false

[[bin]]
name = "rune-egress-proxy"
path = "src/main.rs"
required-features = ["cli"]

[features]
cli = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }
rune-cidr.workspace = true
rune-host-match.workspace = true
rune-ip.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
