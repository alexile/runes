[package]
name = "rune-probe-ssh"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Read-only SSH probe and policy grader: banner, KEXINIT algorithm grading, Terrapin check, version CVE hints and host-key fingerprint"
license.workspace = true
keywords = ["ssh", "probe", "kex", "audit", "security"]
categories = ["network-programming", "parser-implementations"]
repository.workspace = true
readme = "README.md"
publish = true

[dependencies]
rune-base64.workspace = true
rune-service-probe.workspace = true
rune-sha256.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
rune-service-probe = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
