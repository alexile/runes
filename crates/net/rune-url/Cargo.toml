[package]
name = "rune-url"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "URL canonicalization, dedup keys, same-origin/same-site tests and scope matching for crawlers and scanners"
license.workspace = true
keywords = ["url", "canonicalization", "normalization", "crawler", "scope"]
categories = ["web-programming", "network-programming", "parser-implementations"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-url"
path = "src/main.rs"
required-features = ["cli"]

[features]
## The `rune-url` command-line tool.
cli = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }
rune-cidr.workspace = true
rune-host-match.workspace = true
rune-idna.workspace = true
rune-ip.workspace = true
rune-psl = { workspace = true, features = ["embedded"] }
rune-url-encode.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
proptest.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
