[package]
name = "rune-http-fingerprint"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Passive HTTP server and stack fingerprint from header order, casing, status-line and error-page quirks"
license.workspace = true
keywords = ["http", "fingerprint", "server", "recon", "security"]
categories = ["web-programming", "network-programming"]
repository.workspace = true
readme = "README.md"
publish = true

[features]
## Serialize and deserialize signatures, features and reports with serde.
serde = ["dep:serde", "rune-http-model/serde", "rune-matchers/serde"]

[dependencies]
rune-http-model.workspace = true
rune-matchers.workspace = true
rune-sha256.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
