[package]
name = "rune-socks"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "SOCKS4/4a/5 sans-I/O codecs (CONNECT, BIND, UDP ASSOCIATE, username/password, GSSAPI framing) with tokio client and server"
license.workspace = true
keywords = ["socks", "socks5", "proxy", "socks4", "tunnel"]
categories = ["network-programming", "parser-implementations", "asynchronous"]
repository.workspace = true
readme = "README.md"
publish = false

[features]
## Async client and server over tokio streams, with a pluggable connector
## and a UDP ASSOCIATE relay.
tokio = ["dep:tokio", "tokio/net", "tokio/io-util", "tokio/macros", "tokio/rt"]

[dependencies]
thiserror.workspace = true
tokio = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["full"] }

[[test]]
name = "tokio"
required-features = ["tokio"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
