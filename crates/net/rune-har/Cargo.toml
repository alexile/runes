[package]
name = "rune-har"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "HAR 1.2 (HTTP Archive) reader and writer over rune-http-model, tolerant of Chrome, Firefox and Charles exports"
license.workspace = true
keywords = ["har", "http", "archive", "traffic", "devtools"]
