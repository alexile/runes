[package]
name = "rune-resample"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Resample an irregular timestamped series to a fixed interval"
license.workspace = true
keywords = ["resample", "timeseries", "interpolation", "downsample", "regularize"]
categories = ["algorithms", "science", "command-line-utilities"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-resample"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "rune_resample"
path = "src/lib.rs"

[features]
cli = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }

[lints]
workspace = true
