[package]
name = "rune-gap-detect"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Detect missing/gap intervals in an expected-cadence timestamped series"
license.workspace = true
keywords = ["gap-detection", "time-series", "cadence", "monitoring", "outage"]
categories = ["algorithms", "science", "command-line-utilities"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-gap-detect"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "rune_gap_detect"
path = "src/lib.rs"

[features]
default = ["std"]
# Without `std` the library builds on `core` and `alloc` only.
std = []
cli = ["dep:clap", "std"]

[dependencies]
clap = { workspace = true, optional = true }

[lints]
workspace = true
