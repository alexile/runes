[package]
name = "rune-changepoint"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Change-point detection: PELT and binary segmentation over L2, normal and Poisson costs, CUSUM, and Bayesian online detection"
license.workspace = true
keywords = ["changepoint", "pelt", "cusum", "time-series", "segmentation"]
categories = ["algorithms", "science", "command-line-utilities"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-changepoint"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "rune_changepoint"
path = "src/lib.rs"

[features]
default = ["std"]
# Without `std` the library builds on `core` and `alloc` only.
std = []
cli = ["dep:clap", "std"]

[dependencies]
clap = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
proptest.workspace = true
