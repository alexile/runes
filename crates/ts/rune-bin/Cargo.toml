[package]
name = "rune-bin"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Fixed and adaptive histogram binning for numeric distributions"
license.workspace = true
keywords = ["histogram", "binning", "statistics", "quantile", "distribution"]
categories = ["algorithms", "science", "command-line-utilities"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-bin"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "rune_bin"
path = "src/lib.rs"

[features]
cli = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }

[lints]
workspace = true
