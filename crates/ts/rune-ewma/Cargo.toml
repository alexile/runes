[package]
name = "rune-ewma"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Exponentially weighted moving average over a numeric stream"
license.workspace = true
keywords = ["ewma", "moving-average", "smoothing", "time-series", "signal"]
categories = ["algorithms", "science", "command-line-utilities"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-ewma"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "rune_ewma"
path = "src/lib.rs"

[features]
cli = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }

[lints]
workspace = true
