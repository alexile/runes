[package]
name = "rune-lowpass"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Low-pass/high-pass digital filter for noisy scalar signals"
license.workspace = true
keywords = ["lowpass", "highpass", "filter", "signal-processing", "dsp"]
categories = ["algorithms", "science", "command-line-utilities"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-lowpass"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "rune_lowpass"
path = "src/lib.rs"

[features]
cli = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }

[lints]
workspace = true
