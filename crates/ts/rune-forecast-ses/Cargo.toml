[package]
name = "rune-forecast-ses"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Exponential smoothing forecasts: SES, Holt, damped trend and Holt-Winters with fitted parameters, prediction intervals and AICc model selection"
license.workspace = true
keywords = ["forecast", "holt-winters", "smoothing", "time-series", "ets"]
categories = ["algorithms", "science", "command-line-utilities"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-forecast-ses"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "rune_forecast_ses"
path = "src/lib.rs"

[features]
cli = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
proptest.workspace = true
