[package]
name = "rune-forecast-ses"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Simple and double exponential smoothing forecaster"
license.workspace = true
keywords = ["forecast", "smoothing", "holt", "time-series", "ses"]
categories = ["algorithms", "science", "command-line-utilities"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-forecast-ses"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "rune_forecast_ses"
path = "src/lib.rs"

[features]
cli = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }

[lints]
workspace = true
