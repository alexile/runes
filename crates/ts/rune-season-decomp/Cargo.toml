[package]
name = "rune-season-decomp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Simple additive/multiplicative seasonal decomposition"
license.workspace = true
keywords = ["seasonal", "decomposition", "timeseries", "trend", "forecasting"]
categories = ["algorithms", "science", "command-line-utilities"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-season-decomp"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "rune_season_decomp"
path = "src/lib.rs"

[features]
cli = ["dep:clap", "dep:serde_json"]

[dependencies]
clap = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[lints]
workspace = true
