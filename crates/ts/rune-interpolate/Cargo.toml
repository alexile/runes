[package]
name = "rune-interpolate"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Linear and spline interpolation for gap-filling irregular series"
license.workspace = true
keywords = ["interpolation", "spline", "timeseries", "gap-filling", "math"]
categories = ["algorithms", "science", "command-line-utilities"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-interpolate"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "rune_interpolate"
path = "src/lib.rs"

[features]
cli = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
