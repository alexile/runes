[package]
name = "rune-leiden"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Leiden community detection — find densely-connected clusters in weighted graphs"
license.workspace = true
keywords = ["leiden", "louvain", "community-detection", "graph", "clustering"]
categories = ["algorithms", "science", "command-line-utilities"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-leiden"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "rune_leiden"
path = "src/lib.rs"


[features]
cli = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }

[lints]
workspace = true
