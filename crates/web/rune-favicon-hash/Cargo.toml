[package]
name = "rune-favicon-hash"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Shodan-style favicon hash: signed MurmurHash3-32 over the MIME-wrapped base64 of the icon bytes"
license.workspace = true
keywords = ["favicon", "shodan", "mmh3", "fingerprint", "recon"]
categories = ["web-programming", "algorithms"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-favicon-hash"
path = "src/main.rs"
required-features = ["cli"]

[features]
## The `rune-favicon-hash` command-line tool.
cli = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }
rune-base64.workspace = true
rune-murmur.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
