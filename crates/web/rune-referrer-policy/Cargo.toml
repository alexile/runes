[package]
name = "rune-referrer-policy"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Parse and analyze Referrer-Policy headers and meta values, flagging leak-prone policies as rune-finding findings"
license.workspace = true
keywords = ["referrer-policy", "referrer", "security", "headers", "web"]
categories = ["web-programming", "parser-implementations"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-referrer-policy"
path = "src/main.rs"
required-features = ["cli"]

[features]
## The `rune-referrer-policy` command-line tool.
cli = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }
rune-finding.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
