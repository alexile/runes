[package]
name = "rune-permissions-policy"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Parse, analyze and canonicalize Permissions-Policy and legacy Feature-Policy headers, flagging over-permissive grants as rune-finding findings"
license.workspace = true
keywords = ["permissions-policy", "feature-policy", "security", "headers", "web"]
categories = ["web-programming", "parser-implementations"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-permissions-policy"
path = "src/main.rs"
required-features = ["cli"]

[features]
## The `rune-permissions-policy` command-line tool.
cli = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }
rune-finding.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
