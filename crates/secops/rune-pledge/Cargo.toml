[package]
name = "rune-pledge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "pledge-style capability reduction: map a simple promise profile to Landlock and seccomp on Linux, with a documented best-effort no-op elsewhere"
license.workspace = true
keywords = ["pledge", "sandbox", "landlock", "seccomp", "security"]
categories = ["os", "os::linux-apis", "command-line-utilities"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-pledge"
path = "src/main.rs"
required-features = ["cli"]

[features]
cli = ["dep:clap"]
# Also emit every report warning as a `tracing` warning event.
tracing = ["dep:tracing"]

[dependencies]
clap = { workspace = true, optional = true }
thiserror.workspace = true
tracing = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rune-landlock.workspace = true
rune-seccomp.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc.workspace = true

[lints]
workspace = true
