[package]
name = "rune-finding"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Shared security finding model: Finding, Severity, Confidence, Location, Evidence and taxonomy references, with a stable fingerprint"
license.workspace = true
keywords = ["security", "finding", "sast", "dast", "vulnerability"]
categories = ["data-structures", "encoding"]
repository.workspace = true
readme = "README.md"
publish = true

[features]
## Serialize and deserialize every type with serde (stable JSON shape).
serde = ["dep:serde"]
## Derive `schemars::JsonSchema` for every type. Implies `serde`.
schemars = ["serde", "dep:schemars"]
## Compute and verify `Cvss` scores from the vector with `rune-cvss`.
cvss = ["dep:rune-cvss"]

[dependencies]
rune-cvss = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
sha2.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[[test]]
name = "proptest"
required-features = ["serde"]

[[test]]
name = "tool_findings"
required-features = ["serde"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
