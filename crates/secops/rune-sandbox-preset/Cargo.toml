[package]
name = "rune-sandbox-preset"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Reusable sandbox presets (dev-tool, network-tool) that compile to rune-namespaces, rune-seccomp, rune-landlock and rune-egress-proxy"
license.workspace = true
keywords = ["sandbox", "security", "bubblewrap", "landlock", "seccomp"]
categories = ["os::linux-apis", "command-line-utilities"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-sandbox-preset"
path = "src/main.rs"
required-features = ["cli"]

[features]
cli = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }
rune-egress-proxy.workspace = true
rune-landlock.workspace = true
rune-namespaces.workspace = true
rune-seccomp.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
