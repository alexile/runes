[package]
name = "rune-seccomp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "seccomp-bpf system call filtering: deny-by-default allowlists and denylists with errno, trap, log and kill actions, kernel detection and best-effort fallback"
license.workspace = true
keywords = ["seccomp", "sandbox", "security", "linux", "bpf"]
categories = ["os::linux-apis", "command-line-utilities"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-seccomp"
path = "src/main.rs"
required-features = ["cli"]

[features]
cli = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }
libc.workspace = true
seccompiler.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
