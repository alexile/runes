[package]
name = "rune-landlock"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Landlock LSM filesystem sandboxing: path allowlist rulesets with ABI detection and best-effort fallback on older kernels"
license.workspace = true
keywords = ["landlock", "sandbox", "security", "linux", "lsm"]
categories = ["os::linux-apis", "filesystem", "command-line-utilities"]
repository.workspace = true
readme = "README.md"
publish = true

[[bin]]
name = "rune-landlock"
path = "src/main.rs"
required-features = ["cli"]

[features]
cli = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }
landlock.workspace = true
libc.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
