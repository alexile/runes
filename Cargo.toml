[workspace.package]
edition = "2024"
rust-version = "1.88"
authors = ["alexile"]
license = "MIT"
repository = "https://github.com/alexile/runes"

[workspace.dependencies]
# Intra-workspace crates: `path` for local development, `version` for publishing.
rune-asn = { path = "crates/net/rune-asn", version = "0.1.0" }
