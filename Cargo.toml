# Third-party crates shared by two or more members, plus versions pinned as
# workspace policy (toml, rand).
async-stream = "0.3"
async-trait = "0.1.92"
axum = "0.8"
bytes = "1.10.1"
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
futures = "0.3.31"
hmac = "0.12"
http = "1"
http-body = "1"
http-body-util = "0.1"
landlock = "0.4.7"
libc = "0.2"
# OpenTelemetry crates move in lockstep (0.31.x). Default features off so a
# member opts into exactly the signals and transports it uses.
opentelemetry = { version = "0.33.1", default-features = false }
opentelemetry-otlp = { version = "0.33.1", default-features = false }
opentelemetry_sdk = { version = "0.33.1", default-features = false }
pin-project-lite = "0.2"
# Proc-macro toolchain.
proc-macro-crate = "3"
proc-macro2 = "1.0.95"
quick-xml = "0.42.0"
quote = "1.0.40"
# Dev-dependency for round-trip property tests. Only the `std`
# feature: no fork/timeout runner, so no extra process or regex machinery.
proptest = { version = "1.7.0", default-features = false, features = ["std"] }
rand = "0.9.2"
rayon = "1"
regex = "1"
reqwest = { version = "0.12.28", features = ["json"] }
schemars = "1"
# BPF compiler behind rune-seccomp. Default features off: no JSON filter
# format, just the Rust API.
seccompiler = { version = "0.5", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha1 = "0.10.6"
redis = { version = "1.8.1", default-features = false }
sha2 = "0.10.9"
subtle = "2"
syn = { version = "2.0.101", default-features = false }
tempfile = "3"
thiserror = "2.0.17"
tokio = "1.45.1"
# Default features off (they pull aws-lc-rs); members pick `ring` and `tls12`.
tokio-rustls = { version = "0.26.6", default-features = false }
tokio-test = "0.4"
toml = "1.2.1"
tower = "0.5"
tower-layer = "0.3"
tower-service = "0.3"
# Only `std` (+ `fmt` for the subscriber): no ansi, env-filter, json or
# tracing-log, so no extra regex, serde or log machinery.
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
tracing-core = "0.1.33"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "std"] }
trybuild = "1.0"
url = "2.5.7"

# Lint policy shared by every member (`[lints] workspace = true`). Tests may unwrap, expect and panic (see clippy.toml). Binaries
# allow `print_stdout` at their crate root. Code that needs `unsafe` opts out
# locally, with a justification, on the narrowest item possible.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
struct_field_names = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
